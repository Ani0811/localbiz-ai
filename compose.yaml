services:
  backend:
    build:
      context: .
      dockerfile: containers/Containerfile.backend
    container_name: localbiz-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - LM_STUDIO_BASE_URL=
      - LM_STUDIO_MODEL=
      - LM_STUDIO_API_KEY=
      - LM_STUDIO_TIMEOUT=
      - DB_PATH=/app/data/localbiz.db
    volumes:
      - localbiz_data:/app/data
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - localbiz-net

  frontend:
    build:
      context: .
      dockerfile: containers/Containerfile.frontend
    container_name: localbiz-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - localbiz-net

networks:
  localbiz-net:
    driver: bridge
    name: localbiz-network

volumes:
  localbiz_data:
    name: localbiz-sqlite-data
